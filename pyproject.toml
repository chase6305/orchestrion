[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestrion"
version = "0.2.0"
description = "A framework for orchestrating robot tasks and managing function calls with synchronization options."
authors = [
    { name = "Jietao Chen" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
color = ["colorlog>=6"]
dev = ["pytest>=7", "ruff>=0.6"]
viser = ["numpy", "viser", "yourdfpy"]

[tool.setuptools.packages.find]
include = ["orchestrion*", "integrations*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
