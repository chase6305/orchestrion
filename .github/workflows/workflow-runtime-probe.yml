name: Bounded workflow runtime comparison

# Final probe: include captured progress and all completed ownership fixes.

on:
  push:
    branches: [optimize-async-resource-lifecycle-20261112]
    paths: [.github/workflows/workflow-runtime-probe.yml]

permissions:
  contents: read

concurrency:
  group: workflow-runtime-probe
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      RAYON_NUM_THREADS: "2"
      MAX_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare the merged baseline
        run: |
          git fetch --depth=1 origin f1f35cb28eaee2a6d043c2181f9605f057a63e10
          git worktree add --detach /tmp/orchestrion-runtime-baseline FETCH_HEAD
          git fetch --depth=1 origin 12433fed6834fc1ecd03abdff7d602fa5a811b5e
          git worktree add --detach /tmp/orchestrion-runtime-before-deadline-checks FETCH_HEAD
      - name: Measure the baseline sequentially
        working-directory: /tmp/orchestrion-runtime-baseline
        env:
          PYTHONPATH: /tmp/orchestrion-runtime-baseline
        run: |
          nice -n 10 timeout 75s python "$GITHUB_WORKSPACE/examples/benchmark_workflow_runtime.py" --counts 512 2048 --payload-items 128 --repeats 3 --label baseline > "$GITHUB_WORKSPACE/runtime-baseline.json"
          cat "$GITHUB_WORKSPACE/runtime-baseline.json"
      - name: Measure the runtime before removing deadline scans
        working-directory: /tmp/orchestrion-runtime-before-deadline-checks
        env:
          PYTHONPATH: /tmp/orchestrion-runtime-before-deadline-checks
        run: |
          nice -n 10 timeout 75s python "$GITHUB_WORKSPACE/examples/benchmark_workflow_runtime.py" --counts 512 2048 --payload-items 128 --repeats 3 --label before-deadline-checks > "$GITHUB_WORKSPACE/runtime-before-deadline-checks.json"
          cat "$GITHUB_WORKSPACE/runtime-before-deadline-checks.json"
      - name: Measure the proposed runtime sequentially
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          nice -n 10 timeout 75s python examples/benchmark_workflow_runtime.py --counts 512 2048 --payload-items 128 --repeats 3 --label proposed > runtime-proposed.json
          cat runtime-proposed.json
      - name: Compare peak allocations for complete eager bursts
        run: |
          nice -n 10 timeout 75s python - <<'PY'
          import os
          import subprocess
          import sys

          script = '''
          import asyncio
          import json
          import os
          import platform
          import runpy
          import sys
          import tracemalloc
          from pathlib import Path

          workspace = os.environ["GITHUB_WORKSPACE"]
          probe = runpy.run_path(workspace + "/examples/benchmark_workflow_runtime.py")
          tracemalloc.start()
          asyncio.run(probe["_with_idle_runs"](2048, 0, eager=True))
          _, peak = tracemalloc.get_traced_memory()
          tracemalloc.stop()
          result = {
              "python": platform.python_version(),
              "label": sys.argv[1],
              "eager_memory": {"nodes": 2048, "peak_traced_bytes": peak},
          }
          output = json.dumps(result, indent=2)
          Path(workspace, "runtime-memory-" + sys.argv[1] + ".json").write_text(output)
          print(output)
          '''
          for label, repository in (
              ("baseline", "/tmp/orchestrion-runtime-baseline"),
              ("before-deadline-checks", "/tmp/orchestrion-runtime-before-deadline-checks"),
              ("proposed", os.environ["GITHUB_WORKSPACE"]),
          ):
              subprocess.run(
                  [sys.executable, "-c", script, label], cwd=repository,
                  env={**os.environ, "PYTHONPATH": repository}, timeout=20, check=True,
              )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: workflow-runtime-comparison
          path: runtime-*.json
